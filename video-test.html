<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Video Test</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
  video {
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 100vw;
    height: 100vh;
    object-fit: contain;
    background: #000;
  }
</style>
</head>
<body>
  <video id="v" src="video.mp4" autoplay loop muted playsinline></video>

  <script>
    const v = document.getElementById('v');
    v.addEventListener('loadedmetadata', () => {
      console.log('=== VIDEO INFO ===');
      console.log('Natural width:',  v.videoWidth);
      console.log('Natural height:', v.videoHeight);
      console.log('Aspect ratio:',  (v.videoWidth / v.videoHeight).toFixed(3));
    });
  </script>
</body>
</html>
